<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Asteroid Shooter</title>
    <link rel="stylesheet" href="gameStyle.css">
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="hud-top">
            <div id="score-display">SCORE: 0</div>
            <div id="health-display">HP: 100%</div>
        </div>
        
        <!-- Virtual Joysticks for Mobile -->
        <div id="stick-left" class="joystick-zone">
            <div class="joystick-base"><div class="joystick-knob" id="knob-left"></div></div>
        </div>
        <div id="stick-right" class="joystick-zone">
            <div class="joystick-base"><div class="joystick-knob" id="knob-right"></div></div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1>NEON BLASTER</h1>
        <p class="desktop-hint">
            WASD / ARROWS to Move<br>
            MOUSE to Aim & Shoot
        </p>
        <p id="mobile-controls-hint">
            Left Stick to Move<br>
            Right Stick to Aim & Shoot<br>
            Might Be Laggy for Some Devices. 
        </p>
        <button class="btn" onclick="startGame()">START MISSION</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" style="display: none;">
        <h1 style="color: #ff3333; text-shadow: 0 0 20px #f00;">CRITICAL FAILURE</h1>
        <p>Final Score: <span id="final-score" style="color:#fff; font-weight:bold;">0</span></p>
        <button class="btn" style="border-color: #ff3333; color: #ff3333; box-shadow: 0 0 10px #f00;" onclick="resetGame()">RETRY</button>
    </div>

<!-- DO NOT EDIT THE JAVASCRIPT... IT HAS AUDIO SYSTEM but you are welcome to ignore this-->
<script>
/**
 * AUDIO SYSTEM
 * Simple synthesizer using Web Audio API to avoid external assets.
 */
const AudioSys = (function() {
    let ctx = null;
    let masterGain = null;

    function init() {
        if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = ctx.createGain();
            masterGain.gain.value = 0.3; // Low volume
            masterGain.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') {
            ctx.resume();
        }
    }

    function playShoot() {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    }

    function playExplosion(large = false) {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1, ctx.currentTime + (large ? 0.5 : 0.2));
        gain.gain.setValueAtTime(large ? 0.5 : 0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (large ? 0.5 : 0.2));
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        osc.stop(ctx.currentTime + (large ? 0.5 : 0.2));
    }

    return { init, playShoot, playExplosion };
})();

/**
 * GAME ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let animationId;
let lastTime = 0;
let score = 0;
let isGameOver = true;

// Input State
const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
const mouse = { x: 0, y: 0, isDown: false };
const joystickLeft = { x: 0, y: 0, active: false };
const joystickRight = { x: 0, y: 0, active: false };

// Game Entities
let player;
let bullets = [];
let asteroids = [];
let particles = [];
let stars = [];
let asteroidSpawnTimer = 0;
let difficultyMultiplier = 1;

// --- RESIZE HANDLING ---
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    generateStars();
}
window.addEventListener('resize', resize);

// --- INPUT HANDLING ---
window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.code)) keys[e.key] = true; });
window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.code)) keys[e.key] = false; });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', () => mouse.isDown = true);
window.addEventListener('mouseup', () => mouse.isDown = false);

// --- TOUCH CONTROLS (Joysticks) ---
function setupJoystick(elementId, knobId, joystickObj) {
    const el = document.getElementById(elementId);
    const knob = document.getElementById(knobId);
    let startX, startY;
    const maxDist = 35; // Max joystick travel

    el.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        joystickObj.active = true;
    }, {passive: false});

    el.addEventListener('touchmove', e => {
        e.preventDefault();
        if (!joystickObj.active) return;
        const touch = e.changedTouches[0];
        let dx = touch.clientX - startX;
        let dy = touch.clientY - startY;
        
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
        }

        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        
        // Normalize -1 to 1
        joystickObj.x = dx / maxDist;
        joystickObj.y = dy / maxDist;
    }, {passive: false});

    const reset = (e) => {
        e.preventDefault();
        joystickObj.active = false;
        joystickObj.x = 0;
        joystickObj.y = 0;
        knob.style.transform = `translate(-50%, -50%)`;
    };

    el.addEventListener('touchend', reset);
    el.addEventListener('touchcancel', reset);
}

setupJoystick('stick-left', 'knob-left', joystickLeft);
setupJoystick('stick-right', 'knob-right', joystickRight);

// --- CLASSES ---

class Star {
    constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2;
        this.alpha = Math.random();
    }
    draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.5})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
    }
    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class Bullet {
    constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * 15;
        this.vy = Math.sin(angle) * 15;
        this.life = 60; // Frames
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }
    draw() {
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#0ff';
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - this.vx * 0.5, this.y - this.vy * 0.5);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

class Asteroid {
    constructor(x, y, size) {
        this.x = x;
        this.y = y;
        this.size = size; // 1 = small, 2 = medium, 3 = large
        this.radius = size * 15 + 10;
        
        // Random velocity aiming somewhat towards center
        const angleToCenter = Math.atan2(height/2 - y, width/2 - x) + (Math.random() - 0.5);
        const speed = (Math.random() * 2 + 1) * difficultyMultiplier;
        this.vx = Math.cos(angleToCenter) * speed;
        this.vy = Math.sin(angleToCenter) * speed;

        this.rotation = 0;
        this.rotSpeed = (Math.random() - 0.5) * 0.1;
        this.hp = size;
        
        // Generate jagged shape
        this.points = [];
        const numPoints = 8 + Math.floor(Math.random() * 4);
        for (let i = 0; i < numPoints; i++) {
            const angle = (i / numPoints) * Math.PI * 2;
            const dist = this.radius * (0.8 + Math.random() * 0.4);
            this.points.push({
                x: Math.cos(angle) * dist,
                y: Math.sin(angle) * dist
            });
        }
    }
    
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotSpeed;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        
        ctx.strokeStyle = '#f0f';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#f0f';
        
        ctx.beginPath();
        ctx.moveTo(this.points[0].x, this.points[0].y);
        for (let i = 1; i < this.points.length; i++) {
            ctx.lineTo(this.points[i].x, this.points[i].y);
        }
        ctx.closePath();
        ctx.stroke();
        
        ctx.restore();
    }
}

class Player {
    constructor() {
        this.x = width / 2;
        this.y = height / 2;
        this.vx = 0;
        this.vy = 0;
        this.angle = -Math.PI / 2;
        this.friction = 0.95;
        this.acceleration = 0.8;
        this.hp = 100;
        this.radius = 15;
        this.shootTimer = 0;
    }

    update() {
        // --- Movement Logic ---
        let ax = 0;
        let ay = 0;

        // Keyboard
        if (keys.w || keys.ArrowUp) ay = -1;
        if (keys.s || keys.ArrowDown) ay = 1;
        if (keys.a || keys.ArrowLeft) ax = -1;
        if (keys.d || keys.ArrowRight) ax = 1;

        // Mobile Joystick Left
        if (joystickLeft.active) {
            ax = joystickLeft.x;
            ay = joystickLeft.y;
        }

        // Apply Accel
        if (ax !== 0 || ay !== 0) {
            this.vx += ax * this.acceleration;
            this.vy += ay * this.acceleration;
        }

        // Apply Friction
        this.vx *= this.friction;
        this.vy *= this.friction;

        // Apply Velocity
        this.x += this.vx;
        this.y += this.vy;

        // Screen Boundaries (Bounce)
        if (this.x < 0) { this.x = 0; this.vx *= -0.5; }
        if (this.x > width) { this.x = width; this.vx *= -0.5; }
        if (this.y < 0) { this.y = 0; this.vy *= -0.5; }
        if (this.y > height) { this.y = height; this.vy *= -0.5; }

        // --- Aiming Logic ---
        // Mouse takes priority if moving, otherwise Joystick
        if (joystickRight.active) {
            // Only update angle if joystick is pushed enough
            if (Math.abs(joystickRight.x) > 0.1 || Math.abs(joystickRight.y) > 0.1) {
                this.angle = Math.atan2(joystickRight.y, joystickRight.x);
            }
        } else {
            // Mouse
            this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
        }

        // --- Shooting Logic ---
        if (this.shootTimer > 0) this.shootTimer--;

        // Shoot if mouse is down OR right joystick is active
        const isShooting = mouse.isDown || (joystickRight.active && (Math.abs(joystickRight.x) > 0.3 || Math.abs(joystickRight.y) > 0.3));

        if (isShooting && this.shootTimer <= 0) {
            this.shoot();
            this.shootTimer = 8; // Fire rate
        }
    }

    shoot() {
        bullets.push(new Bullet(this.x + Math.cos(this.angle)*20, this.y + Math.sin(this.angle)*20, this.angle));
        AudioSys.playShoot();
        // Recoil
        this.vx -= Math.cos(this.angle) * 1;
        this.vy -= Math.sin(this.angle) * 1;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        ctx.shadowBlur = 15;
        ctx.shadowColor = '#0ff';
        ctx.fillStyle = '#000';
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 2;

        // Draw Ship
        ctx.beginPath();
        ctx.moveTo(20, 0); // Tip
        ctx.lineTo(-15, 10); // Back Right
        ctx.lineTo(-10, 0); // Engine
        ctx.lineTo(-15, -10); // Back Left
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Draw Engine Flame if moving
        if (Math.abs(this.vx) > 0.5 || Math.abs(this.vy) > 0.5) {
            ctx.beginPath();
            ctx.moveTo(-12, 0);
            ctx.lineTo(-25 - Math.random() * 10, 0);
            ctx.strokeStyle = '#f00';
            ctx.shadowColor = '#f00';
            ctx.stroke();
        }

        ctx.restore();
    }
}

// --- CORE FUNCTIONS ---

function generateStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push(new Star());
    }
}

function spawnAsteroid() {
    // Spawn at edge of screen
    let x, y;
    if (Math.random() < 0.5) {
        // Top or Bottom
        x = Math.random() * width;
        y = Math.random() < 0.5 ? -50 : height + 50;
    } else {
        // Left or Right
        x = Math.random() < 0.5 ? -50 : width + 50;
        y = Math.random() * height;
    }
    
    // Choose size based on difficulty
    const sizeRoll = Math.random();
    let size = 1;
    if (sizeRoll > 0.6) size = 2;
    if (sizeRoll > 0.9) size = 3;

    asteroids.push(new Asteroid(x, y, size));
}

function createExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function checkCollisions() {
    // Bullet vs Asteroid
    for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = asteroids.length - 1; j >= 0; j--) {
            const b = bullets[i];
            const a = asteroids[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < a.radius) {
                // Hit
                a.hp--;
                createExplosion(b.x, b.y, '#f0f', 5);
                bullets.splice(i, 1);
                
                if (a.hp <= 0) {
                    // Destroyed
                    score += a.size * 100;
                    createExplosion(a.x, a.y, '#f0f', a.size * 10);
                    AudioSys.playExplosion(a.size === 3);
                    asteroids.splice(j, 1);
                }
                break; // Bullet hit something, stop checking this bullet
            }
        }
    }

    // Player vs Asteroid
    if (player.hp > 0) {
        for (let i = 0; i < asteroids.length; i++) {
            const a = asteroids[i];
            const dx = player.x - a.x;
            const dy = player.y - a.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < player.radius + a.radius) {
                // Crash
                player.hp -= 34; // 3 hits to die
                createExplosion(player.x, player.y, '#f00', 20);
                asteroids.splice(i, 1);
                AudioSys.playExplosion(true);
                
                // Camera shake or flash effect?
                document.body.style.backgroundColor = '#300';
                setTimeout(() => document.body.style.backgroundColor = '#050505', 50);

                if (player.hp <= 0) {
                    gameOver();
                }
            }
        }
    }
}

function update() {
    if (isGameOver) return;

    // Difficulty ramp up
    difficultyMultiplier += 0.0001;

    // Player
    player.update();

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update();
        if (bullets[i].life <= 0) bullets.splice(i, 1);
    }

    // Asteroids
    asteroidSpawnTimer--;
    if (asteroidSpawnTimer <= 0) {
        spawnAsteroid();
        asteroidSpawnTimer = Math.max(20, 60 - score/500); // Spawn faster as score goes up
    }
    
    for (let i = asteroids.length - 1; i >= 0; i--) {
        asteroids[i].update();
        // Remove if too far off screen
        if (asteroids[i].x < -100 || asteroids[i].x > width + 100 || 
            asteroids[i].y < -100 || asteroids[i].y > height + 100) {
            asteroids.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    checkCollisions();

    // UI Updates
    document.getElementById('score-display').innerText = `SCORE: ${score}`;
    document.getElementById('health-display').innerText = `HP: ${Math.max(0, Math.ceil(player.hp))}%`;
    document.getElementById('health-display').style.color = player.hp < 40 ? '#f00' : '#fff';
}

function draw() {
    // Trail effect
    ctx.fillStyle = 'rgba(5, 5, 5, 0.4)';
    ctx.fillRect(0, 0, width, height);

    stars.forEach(s => s.draw());
    bullets.forEach(b => b.draw());
    asteroids.forEach(a => a.draw());
    particles.forEach(p => p.draw());
    
    if (player.hp > 0) player.draw();
}

function gameLoop(timestamp) {
    if (lastTime === 0) lastTime = timestamp;
    const dt = timestamp - lastTime;
    
    update();
    draw();

    lastTime = timestamp;
    if (!isGameOver) {
        animationId = requestAnimationFrame(gameLoop);
    }
}

function startGame() {
    console.log ('JS: Generated Game successfully on Start Game JavaScript code.')
    AudioSys.init();
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
    
    resize();
    player = new Player();
    bullets = [];
    asteroids = [];
    particles = [];
    score = 0;
    difficultyMultiplier = 1;
    isGameOver = false;
    player.hp = 100;
    
    lastTime = 0;
    animationId = requestAnimationFrame(gameLoop);
}

function resetGame() {
    startGame();
}

function gameOver() {
    isGameOver = true;
    document.getElementById('game-over-screen').style.display = 'flex';
    document.getElementById('final-score').innerText = score;
}

// Initial Setup
resize();
generateStars();
// Console.Log Setup alerts (YOU CAN REMOVE THIS)
console.log ('JS/CSS: Generated stars successfully on game CSS')
console.log ('JS: Resize Was Successfull')
console.log ('HTML: Added Texts')
console.log ('JS/HTML: JavaScript Added')
</script>
</body>
